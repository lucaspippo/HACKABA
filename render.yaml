# Render Blueprint — LA DEMO ENTERA, DESDE CERO, SIN TOCAR NADA A MANO.
#
# Levanta tres cosas de una sola sincronización:
#   1. la base Postgres administrada
#   2. el servicio web (API + frontend compilado en un solo puerto)
#   3. el esquema y los datos: Alembic como preDeployCommand, y el seed del
#      dataset en el arranque del contenedor (deploy/boot.py)
#
# "New +" -> "Blueprint" -> conectar este repo -> Render lee este archivo.
#
# EL NOMBRE DEL SERVICIO. Se llama `polpilot-hackathon` y no `polpilot-app`
# a propósito: `polpilot-app` es el servicio del repo del producto
# (agustindelmonti/polpilot-app), donde vive la demo pública. Dos servicios con
# el mismo nombre en la misma cuenta de Render chocan, y aunque estén en
# cuentas distintas, tener dos "polpilot-app" apuntando a repos distintos es
# una confusión esperando a pasar: el día que haya que mirar un log, nadie va a
# saber cuál es cuál. Este blueprint es el de la hackathon y se llama así.
#
# La topología objetivo (y qué justificaría construirla) está en
# deploy/ARCHITECTURE.md §3.

databases:
  # LA BASE ESTÁ ACÁ, no cargada a mano. Antes `DATABASE_URL` era `sync: false`
  # y no había ningún bloque `databases:`: o sea que una sincronización desde
  # cero creaba el servicio web con la variable VACÍA, el preDeployCommand
  # intentaba `alembic upgrade head` sin a dónde conectarse, y el deploy moría
  # antes de construir nada. Con la base declarada acá, Render la crea primero
  # y le pasa la URL al servicio (ver `fromDatabase` más abajo).
  - name: polpilot-hackathon-db
    databaseName: polpilot        # el nombre de la base adentro del server
    user: polpilot                # el rol DUEÑO: Alembic y consultas de admin
    # OJO CON EL NOMBRE DEL PLAN: Render usa ids del tipo `0.1c-256mb`
    # (CPU + memoria), no nombres tipo `basic-256mb`. Un id que no existe hace
    # fallar la sincronización ENTERA del blueprint, y el mensaje no dice cuál
    # de los dos recursos lo causó. Los válidos son `free`, `0.1c-256mb`,
    # `0.5c-1g`, `1c-2g`, y de ahí para arriba.
    #
    # `0.1c-256mb` es de pago y no expira. `free` también alcanza de sobra para
    # esto, pero se vence a los 30 días y se borra: para algo que tiene que
    # estar en pie el día del pitch, esa fecha de vencimiento es un riesgo que
    # no vale el ahorro. Cambialo a `free` si preferís lo otro.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: polpilot-hackathon
    runtime: docker
    plan: starter          # 512 MB alcanza; el free duerme y arruina la primera impresión
    healthCheckPath: /api/health

    # Las migraciones corren ANTES de que arranque ninguna instancia de la
    # versión nueva, así una migración fallida hace fallar el deploy y la
    # instancia que está sirviendo sigue en pie. Adentro del contenedor lo que
    # hacía era matar el proceso, que bajaba el servicio. Ver deploy/migrate.py.
    # Ese script además CREA el rol sin bypass de RLS (ver más abajo).
    preDeployCommand: python /app/deploy/migrate.py

    envVars:
      # ======================================================================
      # 1 · LA BASE — la completa Render sola desde el bloque `databases:`
      # ======================================================================
      - key: DATABASE_URL
        fromDatabase:
          name: polpilot-hackathon-db
          property: connectionString

      # APP_DATABASE_URL NO está acá, y no es un olvido.
      #
      # La app usa DOS conexiones a la MISMA base: `DATABASE_URL` con el rol
      # dueño (Alembic, fila del tenant) y `APP_DATABASE_URL` con un rol SIN
      # bypass de RLS para todo lo que toca datos del tenant. Si las dos usan
      # el rol dueño, Row-Level Security deja de tener efecto EN SILENCIO —un
      # superusuario lo saltea siempre— y no hay error que lo delate.
      #
      # Render no puede armarla: `fromDatabase` sólo sabe dar la del dueño.
      # Así que el rol lo crea `deploy/migrate.py` con la contraseña de abajo,
      # y `deploy/boot.py` arma la URL (deploy/dburl.py, una sola derivación
      # para los dos). Si algún día se apunta a Supabase, alcanza con setear
      # APP_DATABASE_URL a mano: lo explícito le gana a lo derivado.
      - key: POLPILOT_APP_DB_PASSWORD
        generateValue: true      # Render la genera y la sincroniza al servicio

      # ======================================================================
      # 2 · LA IA — va por el GATEWAY DE VERCEL, no por Anthropic directo
      # ======================================================================
      # El token es lo único de este bloque que hay que cargar a mano
      # (Dashboard -> Environment). Sin él, `modo_angela` queda en "offline" y
      # NADA fuera del guion del demo contesta.
      - key: AI_GATEWAY_API_KEY
        sync: false

      # El proveedor, explícito. Sin esto se autodetecta —hay
      # AI_GATEWAY_API_KEY y no hay ANTHROPIC_API_KEY, así que daría gateway
      # igual— pero dejarlo implícito significa que el día que alguien cargue
      # una ANTHROPIC_API_KEY "para probar", el proveedor cambia solo y los
      # slugs de abajo dejan de servir. Declarado, no cambia por accidente.
      - key: LLM_PROVIDER
        value: gateway

      # EL FORMATO DEL SLUG NO ES COSMÉTICO. Por el gateway va con prefijo de
      # proveedor y versión CON PUNTO (`anthropic/claude-sonnet-5`); por
      # Anthropic directo va con guiones y sin prefijo (`claude-sonnet-5`).
      # Mezclarlos devuelve HTTP 400 y Ángela queda muda en la primera
      # pregunta. Por eso son dos variables distintas: GATEWAY_MODEL le gana a
      # ANGELA_MODEL cuando el proveedor activo es el gateway, así que las dos
      # formas pueden convivir sin pisarse (ver backend/config.py).
      - key: GATEWAY_MODEL
        value: anthropic/claude-sonnet-5

      # El modelo CHICO, para el camino de tool-use que no razona (abrir una
      # pantalla, un widget, un recordatorio). Mismo formato de gateway. Sin
      # esto el routing por tema no baja nada: anda igual, sale más caro.
      - key: ANGELA_MODEL_SIMPLE
        value: anthropic/claude-haiku-4.5

      # ======================================================================
      # 3 · QUÉ TENANT ES ESTE SERVICIO
      # ======================================================================
      # Obligatoria. `deploy/migrate.py` y `deploy/boot.py` se niegan a correr
      # sin esto: core/paths.py cae a "demo" por default, así que una variable
      # sin setear serviría los datos del tenant demo por descuido.
      - key: POLPILOT_TENANT
        value: demo

      # Regenera y resiembra el dataset en cada arranque. Correcto para el
      # demo —el disco de Render es efímero, así que cada reinicio vuelve a un
      # estado limpio— y es pérdida de datos en un tenant productivo, donde
      # NUNCA hay que ponerlo: data-demo/generar.py reescribe todo.
      - key: POLPILOT_SEED_ON_BOOT
        value: "1"

      # POLPILOT_CANONICAL_DIR NO va acá: ya lo trae la imagen
      # (Dockerfile: /app/canonical). Es una propiedad del LAYOUT de la imagen,
      # no del tenant — es justo por eso que el guard del Dockerfile la deja
      # pasar. Declararla acá con otra ruta la pisaba sin ningún motivo.

      # ======================================================================
      # 4 · EL DEMO
      # ======================================================================
      # LA FECHA CONGELADA. El dataset tiene una historia sembrada que termina
      # acá: los cruces se calculan contra "hoy", así que con la fecha real
      # (2026-09) todo queda fuera de ventana y los cruces DEJAN DE EMITIR. La
      # pantalla no se rompe: se queda vacía, que es peor, porque parece que el
      # producto no encontró nada.
      - key: POLPILOT_DEMO_TODAY
        value: "2026-07-07"

      - key: POLPILOT_DEMO_AUTOLOGIN
        value: "1"         # sin pantalla de login: el link público entra directo
      - key: POLPILOT_DEMO_ROLE_SWITCH
        value: "1"         # el selector "Ver como"
      - key: POLPILOT_DEMO_MSG_CAP
        value: "35"        # tope de mensajes por sesión
      - key: POLPILOT_DEMO_IP_CAP
        value: "60"        # freno de gasto por IP/día, sobrevive a un re-login

      # El idioma del tenant. `es`, no `en`: el pitch es en español y además el
      # precalentado del arranque llena PRIMERO este idioma (ver
      # core/analisis_cache.precalentar) — con `en` acá, la pantalla que se va a
      # mostrar sería la última en quedar caliente.
      - key: POLPILOT_DEFAULT_LANG
        value: es

      # ======================================================================
      # 5 · SECRETOS — a mano en el dashboard
      # ======================================================================
      - key: POLPILOT_RESET_TOKEN
        sync: false        # protege POST /api/admin/reset-demo

# El techo real del gasto de IA NO está en este archivo. El cap por IP de
# arriba es un freno blando; el límite que no se puede evadir se pone afuera de
# la app — un spend limit sobre la credencial, en el gateway.
